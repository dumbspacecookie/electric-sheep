[project]
name = "electric-sheep"
version = "0.1.0"
description = "An arcade for agents. Willy Wonka meets the Cheshire Cat meets Blade Runner."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
electric-sheep = "electric_sheep.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["electric_sheep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
